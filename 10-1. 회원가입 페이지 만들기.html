<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입</title>
  </head>
  <body>
    <img src="./img/logo.png" alt="로고(이미지)" width="100">

    <form action="#" method="post">
    
    <div>
      <label for="user_id">아이디: </label>
      <input type="text" id="user_id" name="user_id" placeholder="아이디를 입력하세요" required>
    </div><br />

    <div>
      <label for="password">비밀번호: </label>
      <input type="password" id="password" name="password" placeholder="비밀번호를 입력하세요" required>
    </div><br />

    <div>
      <label for="user_name">이름: </label>
      <input type="text" id="user_name" name="user_name" placeholder="이름을 입력하세요" required>
    </div><br />

    <p>관심 분야</p>
    <label for="html">HTML</label>
    <input type="checkbox" name="hobby" id="html" value="html"><br />
    <label for="css">CSS</label>
    <input type="checkbox" name="hobby" id="css" value="css"><br />
    <label for="javascript">JAVASCRIPT</label>
    <input type="checkbox" name="hobby" id="javascript" value="javascript"><br />

    <p>가입경로</p>
    <label for="blog">BLOG(블로그)</label>
    <input type="radio" name="join_path" id="blog" value="blog"><br />
    <label for="recommend">RECOMMEND(추천)</label>
    <input type="radio" name="join_path" id="recommend" value="recommend"><br />
    <label for="etc">ETC(기타)</label>
    <input type="radio" name="join_path" id="etc" value="etc"><br />

    <div>
      <input type="checkbox" id="agree" name="agree" required>
      <label for="agree">
        <a href="">개인정보처리방침</a>에 동의합니다.
      </label>
    </div><br />

    <button type="submit">가입하기</button>

    </form>
  </body>
</html>
