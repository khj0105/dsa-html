<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>회원가입</title>
</head>
<body>
  <img src="./img/logo.png" alt="로고(이미지)" width="100">

  <p>관심 분야</p>
  <label for="html">HTML</label>
  <input type="checkbox" name="hobby" id="html" value="html"><br />
  <label for="css">CSS</label>
  <input type="checkbox" name="hobby" id="css" value="css"><br />
  <label for="javascript">JAVASCRIPT</label>
  <input type="checkbox" name="hobby" id="javascript" value="javascript"><br />

  <p>가입경로</p>
  <label for="blog">BLOG</label>
  <input type="radio" name="join_path" id="blog" value="blog">블로그<br />
  <label for="recommend">RECOMMEND</label>
  <input type="radio" name="join_path" id="recommend" value="recommend">추천<br />
  <label for="etc">ETC</label>
  <input type="radio" name="join_path" id="etc" value="etc">기타<br />

  <button type="submit">가입하기</button>
</body>
</html>
