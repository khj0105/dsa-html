<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>10. 폼 태그</title>
</head>
<body>
  <!-- 
    get 방식: 폼 데이터를 url에 담아서 전송 (url에 데이터가 노출, 전송 용량 제한)
    post 방식: 폼 데이터를 http 요청 body(본문)에 담아서 전송 (데이터가 노출 X, 전송 용량 제한 X)
  -->
  <form action="#" method="post"><!-- form 태그의 역할은 안에 있는 input요소들을 모아서 서버에 전송, form형식에 따로 지정안하면 get방식으로 전송 -->
    <!-- <label for="txt1"> 아이디 </label>
    <input type="text" name="" id="txt1"> <br />
    <label> 패스워드 : <input type="text" name="" id=""></label><br /> -->
    <fieldset>
      <legend>회원정보</legend>
    <label for="txt1"> 텍스트 </label>
    <input type="text" name="txt1" id="txt1" placeholder="입력하세요"  maxlength="5" minlength="2" required> <br />

    <label for="password">패스워드</label>
    <input type="password" name="password" id="password" /> <br />
    
    <label for="user-email">이메일:</label>
    <input
        type="email"
        id="user-email"
        name="email"
        placeholder="id@example.com"
        required
    ></fieldset><br />
    
    <label for="product-quantity">상품 수량 (1~10개):</label>
    <input type="number" id="product-quantity" name="quantity" value="1" min="1" max="10" step="1"><br />
    
    <label for="reservation-date">예약 날짜:</label>
    <input
        type="date"
        id="reservation-date"
        name="reservation_date"
        min="2026-01-01"
        max="2026-12-31"
        required
    > <br />

    <!-- radio, checkbox보다 name이 같아야 함. value값이 전송 됨 -->
    <label for="profile-photo">프로필 사진 (이미지만):</label>
    <input type="file" id="profile-photo" name="photo"> <br />

    <label for="male">남성</label>
    <input type="radio" name="gender" id="male" value="male" checked>
    <label for="female">여성</label>
    <input type="radio" name="gender" id="female" value="female"> <br />

    <label for="html">HTML</label>
    <input type="checkbox" name="interests" id="html" value="html">
    <label for="javascript">JavaScript</label>
    <input type="checkbox" name="interests" id="javascript" value="javascript">
    <label for="css">CSS</label>
    <input type="checkbox" name="interests" id="css" value="css"> <br />

    <label for="review">리뷰</label>
    <textarea name="review" id="review" rows="5" cols="40"></textarea> <br />

    <label for="city">도시</label>
    <select id="city" name="city" multiple>
      <option>-- 선택하세요 --</option>
      <option value="seoul">서울</option>
      <option value="dajeon">대전</option>
      <option value="busan" selected>부산</option>
    </select> <br />

    <!-- <input type="submit" value="전송하기"> -->
    <button type="submit">전송</button>
    <button type="reset">취소</button>
    <button type="button" onclick="alert('버튼 클릭')">일반버튼</button>
  </form>
</body>
</html>
