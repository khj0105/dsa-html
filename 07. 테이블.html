<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>07. 테이블</title>
  </head>
  <body>
    <table border="1">
      <tr>
        <!-- th: 테이블에서 컬럼(열)의 제목을 지정하는 태그 -->
        <th>컬럼1</th>
        <th>컬럼2</th>
      </tr>
      <tr> <!-- tr: 행을 지정 태그-->
        <!-- HTML 주석 -->
        <td>셀1</td><!-- td: 열을 지정 태그-->
        <td>셀2</td>
      </tr>
      <tr>
        <td>셀3</td>
        <td>셀4</td>
      </tr>
    </table>

    <!-- 셀 합치기 -->
    <h3>셀 합치기</h3>
    <table border="1" width="100">
      <tr>
        <td colspan="3">1</td>
        <!-- <td width="30">2</td> -->
        <!-- <td>3</td> -->
      </tr>
      <tr>
        <td rowspan="2">4</td>
        <td colspan="2" rowspan="2">5</td>
        <!-- <td>6</td> -->
      </tr>
      <tr>
        <!-- <td>7</td> -->
        <!-- <td>8</td> -->
        <!-- <td>9</td> -->
      </tr>
    </table>

    <h4>표 구조 정의하기</h4>
    <table border="1">
      <caption>학생 성적표</caption>
      <thead>
        <tr>
          <th>이름</th>
          <th>국어</th>
          <th>영어</th>
          <th>수학</th>
          <th>평균</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>김철수</td>
          <td>85</td>
          <td>90</td>
          <td>78</td>
          <td>84.3</td>
        </tr>
        <tr>
          <td>이영희</td>
          <td>92</td>
          <td>88</td>
          <td>95</td>
          <td>91.7</td>
        </tr>
        <tr>
          <td>박민수</td>
          <td>76</td>
          <td>82</td>
          <td>89</td>
          <td>82.3</td>
        </tr>
      </tbody>
      <tfoot>
        <tr>
          <td>합계</td>
          <td>253</td>
          <td>260</td>
          <td>262</td>
          <td>258.3</td>
        </tr>
      </tfoot>
    </table>
  </body>
</html>
