<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>02. 기본 선택자</title>
    <style>
    /* 
      기본 선택자: 어떤 요소에 스타일 적용할지 선택하는 부분
      1. 태그 선택자: 해당 태그를 가진 모든 요소를 선택, 태그 이름을 적는다.
    */
      p {color: #444;}
      /*
    /* 2. 클래스 선택자: class="..." 라는 속성을 가진 요소를 선택
        - 이름 앞에 .을 붙을 붙인다.
        - 같은 클래스를 여러 요소에 재사용할 수 있다.
    */
      .hightlight {
        background-color: #fff59d;
      }
      
      .rounded {
        border-radius: 6px;
      }
      /* 3. 아이디 선택자: id="..." 가 붙은 요소를 선택
        - 이름 앞에 #을 붙인다.
        - id는 한 페이지에서 중복되지 않는다.
      */
      #underline {
        color: red;
        border-bottom: 1px solid red;
      }
      /* 일반적인 경우에는 클래스 속성을 주로 사용하고
          페이지에서 특별한 요소에만 id 속성을 사용 */
    </style>
  </head>
  <body>
    <h1>기본 선택자</h1>
    <h2>태그 선택자</h2>
    <p>이 문장은 회색입니다.</p>
    <p>이 문장은 회색입니다.</p>

    <h2 class="hightlight">클래스 선택자</h2>
    <p class="hightlight rounded">이 문장은 노란 형광펜 효과가 적용됩니다.</p>

    <h2>아이디 선택자</h2>
    <p id="underline" class="hightlight">이 문장은 빨간 밑줄이 적용됩니다.</p>
  </body>
</html>
