<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>04. 색상과 배경</title>
    <style>
      .swatch-row {
        display: flex;
        flex-wrap: wrap;
      }
      .swatch {
        width: 100px;
        height: 100px;
        border: 1px solid black;
        border-radius: 50px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
    </style>
  </head>
  <body>
    <h1>웹에서 색상 표현하기</h1>
    <div class="swatch-row">
      <div class="swatch" style="background-color: tomato;">색상 이름</div>
      <!-- RGB: #RRGGBB, 0~9, A-F 16진수 방식-->
      <div class="swatch" style="background-color: #3498db;">16진수</div>
      <!-- RGB(빨강, 초록, 파랑) 각각 0 ~ 255 -->
      <div class="swatch" style="background-color: rgb(46, 200, 113);">rgb</div>
      <!-- RGBA: RGB랑 같고 마지막에 A(알파, 투명도) 값이 추가-->
      <div class="swatch" style="background-color: rgba(155, 89, 182, 0.7);">rgba</div>
    </div>
  </body>
</html>
