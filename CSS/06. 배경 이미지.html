<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>06. 배경 이미지</title>
    <style>
      .section {
        border: 1px solid black;
        width: 300px;
        height: 300px;
        background-color: yellow;
        background-image: url(./img/castle.jpg);
        /* cover: 이미지의 비율을 유지하면서 이미지가 배경을 덮도록 확대 또는 축소 
          contain: 이미지의 비율을 유지하면서 이미지 전체가 박스 안에 들어가는 방식
        */
        background-size: contain;
        /* 이미지를 반복해서 출력하지 않는다. */
        background-repeat: no-repeat;
        background-position: center;
      }
    </style>
  </head>
  <body>
    <h2>배경 이미지</h2>
    <div class="section">div 요소</div>
  </body>
</html>
