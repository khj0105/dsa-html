<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>08. 내장객체</title>
    <script>
      // Number(): 숫자로 변환
      console.log(Number("10"));
      console.log(Number("  10  ")); // 공백 무시
      console.log(Number("10.33"));
      console.log(Number(true)); // 1
      console.log(Number(false)); // 0
      console.log(Number("John")); // NaN(type은 number이지만 숫자로 변환 x)
      console.log(Number("10,33")); // NaN

      // 숫자를 다듬는 메서드
      {
        let price = 1234567;
        let pi = 3.14159;
        console.log(pi.toFixed(2)); // Fixed는 고정 소수점 소수점2자리까지
        console.log(price.toLocaleString()); // 천 단위마다 , 들어감 (숫자에 쉼표)
        console.log((255).toString(16)); // 16진수 표현
      }

      // Math
      console.log(Math.round(4.5)); // 반올림
      console.log(Math.floor(4.5)); // 내림
      console.log(Math.max(1,3,2)); // 최대값
      console.log(Math.sqrt(16)); // 제곱근, 4
      console.log(Math.PI); // 원주율

      console.log(Math.floor(Math.random() * 6) + 1); //Math.random는 0 ~ 1미만

      // Date: 날짜 정보
      {
        let now = new Date("2026-06-01T10:30:00");
        console.log(now);
        console.log(now.getFullYear());
        console.log(now.getMonth() +1); // Month는 0부터 시작
        console.log(now.getDate());
        console.log(now.getHours());
      }

      // 현재 날짜를 YYYY-MM-DD 형식으로 출력하시오.
      {
        let now = new Date();
        let year = now.getFullYear();
        // string.padStart(길이, 채울문자)
        let month = String(now.getMonth() + 1).padStart(2, "0");
        let date = String(now.getDate()).padStart(2, "0");
        console.log(`${year}-${month}-${date}`);
      }

      // 전역함수 (parseInt, parseFloat, isNaN)
      console.log(parseInt("42px")); // 문자로 된 숫자를 정수형태로 추출, 숫자만 추출
      console.log(parseFloat("3.14rem"));
      console.log(parseInt("abc")); // 숫자가 하나라도 있어야함
      console.log(isNaN("hello"));  // true
      console.log(isNaN("123"));    // false


    </script>
  </head>
  <body>
    
  </body>
</html>
