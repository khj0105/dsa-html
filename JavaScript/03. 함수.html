<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3. 함수</title>
    <script>
      // 1. 함수의 정의와 호출
      {
        function greet(name){
          return "Hello, " + name + "!";
        }
        let message = greet("홍길동");
        console.log(message);
      }

      // 2. 매개변수와 반환값
      {
          function multifly(a, b) {
              return a * b;
          }
          console.log(multifly(4, 3));
          console.log(multifly(5, 5));
      }

      // 3. 기본 매개변수
      {
        function greet(name = "Guest") {
          return `Hello ${name}!`;
        }
        console.log(greet("Alice"));  // 우선임
      }

      // 4. 함수 표현식 (익명 함수)
      {
        const add = function (a,b){
          return a + b;
        };
        console.log(add(2,3));
      }

      // 5. 화살표 함수
      {
        const add = (a, b) => {return a + b}; // 본문이 표현식 하나면 {}, return 생략 가능
        console.log(add(2,3));
        // const add1 = (a, b) => a+ b;
        
        const square = x => x * x; // 매개변수가 하나면 ()도 생략
        console.log(square(4));

        const sayHello = () => "안녕하세요";  // 매개변수가 없으면 빈 () 필수
        console.log(sayHello());

        const makePerson = (name, age) => ({name, age}); // 객체의 반환은 () 감싼다
        console.log(makePerson("영화", 25));
      }

        // 6. 화살표 함수 + 배열 map
        const numbers = [1, 2, 3, 4, 5];
        console.log(numbers.length); // 배열의 길이
        console.log(numbers[0]);
        console.log(numbers[1]);
        
        // 배열의 요소를 전체 출력
        for (let i = 0; i < numbers.length; i++) {
          console.log(numbers[i]);
        }
        // forEach() 메서드
        const fruits = ["사과", "바나나", "오렌지"];
        fruits.forEach(fruit => {
            console.log(fruit);
        }); // 함수의 매개변수로 들어가는 함수(콜백함수)

        // numbers 배열 요소의 값에 2를 곱한 값을 가진 새로운 배열을 만드시오
        const doubled = [];
        // doubled.push(1);
        // doubled.push(2);
        // for (let i = 0; i < numbers.length; i++) {
        //   doubled.push(numbers[i] * 2);
        // }
        numbers.forEach((num) => {
          doubled.push(num * 2);
        });
        console.log(doubled);

        // 웹 브라우저에서 결과 확인
        document.write(numbers);

        // 7. 콜백 함수
        {
          function doSomething(callback) {
            console.log("작업 수행중...");
            callback(); // 전달받은 함수를 실행
          }

          doSomething(function() {
            console.log("콜백 함수가 실행됨!");
          });
        }

        setTimeout(() => {console.log("2초 뒤에 실행")},2000);
    </script>
  </head>
  <body>
    
  </body>
</html>
