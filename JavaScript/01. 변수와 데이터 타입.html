<!DOCTYPE html>
  <html lang="ko">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>01. 변수와 데이터 타입</title>
    <script>
      console.log('Hello world');
      console.error("Error Message");
      console.warn('Warn Message');
      console.clear();

      // 주석(여러 줄 주석은 없음)

      // 변수의 선언
      let name = '홍길동';
      //// js는 선언이 아닌 실행단계에서 타입이 정해진다
      let age = 20; // 자바스크립트는 정수와 실수를 구분하지 않고 number타입으로 하나로 봄
      age = 30;
      console.log('이름: ', name, ', 나이: ', age);
      //변수를 초기화 하지 않으면 undefined가 출력됨
      //undifined도 에러가 아니라 하나의 dataType

      // const name = '홍길동';
      // let age = 20;
      // age = 30;
      // name = '홍길동';
      // console.log('이름: ', name, ', 나이: ', age) const(상수)를 바꾸려고하면 Error출력
    
      // 기본형 데이터 타입
      // Number
      let n1 = 10;
      let n2 = 20;
      let n3 = 3.14;
      console.log('n1: ', n1, ', n2: ', n2, ', n3: ', n3);
      console.log(typeof n1); // number

      console.log('A' * 2); // NaN (Not a Number) 문자곱셉은 안된다
      console.log(typeof 'A'); // string
      console.log(typeof ('A' * 2)); // number

      console.log(2 / 1); // 2
      console.log(2 / 0); // Infinity
      console.log(typeof (2 / 0)); // number

      // 문자열(String)
      console.log('안녕하세요'); // 작은 따옴표 or 큰 따옴표
      console.log(`안녕하세요`); // 백틱
      console.log(typeof '안녕하세요'); // string

      // 진위형(Boolean)
      let a = true;
      console.log(a, typeof a); // true 'boolean'

      // Undifined
      let b;
      console.log(b, typeof b); // undefined 'undefined'

      // null
      let c = null;
      console.log(c, typeof c); // null 'object'

      // Symbol
      console.log('id' == 'id'); // true
      console.log('id' === 'id'); // true (===는 타입까지 비교)

      console.log(5 == '5'); // true
      console.log(5 === '5'); // false
      console.log('5' === '5'); // true
      console.log(Symbol('5') == Symbol('5')); // fasle (Symbol은 객체를 고유하게 만든다)

      // Bigint
      let d = 12345678901234567890;
      console.log(d); // 오차 有
      d = 12345678901234567890n;
      console.log(d, typeof d); // 정상 출력, 'bigint' 타입
    </script>
    <script src="./hello.js" defer></script>
  </head>
  <body>
    <h1>자바스크립트</h1>
    <script>
      console.log('Hello world body');
    </script>
  </body>
</html>
