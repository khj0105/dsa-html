<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>06. BOM 기초</title>
    <script>
      // HTML DOM이 완전히 로드 되면 내부 코드를 실행한다.
      document.addEventListener("DOMContentLoaded", () => {
      <!-- <script defer> // script옆에 defer가 추가되면 body쪽 먼저 실행후 script 실행 -->
            document.getElementById("btn").addEventListener("click", () => {
              // location.href: 현재 보고있는 페이지의 전체 주소(URL)
              console.log("location.href:", location.href);

              console.log("navigator.userAgent:", navigator.userAgent);
              // navigator.language: 브라우저에 설정된 언어
              console.log("navigator.language:", navigator.language);
              // screen.width / height: 모니터의 해상도
              console.log("화면 해상도:", screen.width, "x", screen.height);
              // window.innerWidth / innerHeight: 브라우저 창 안쪽 크기
              console.log(
                "창 안쪽 크기(window):",
                window.innerWidth, 
                "x", 
                window.innerHeight,
              );
            });

            document.getElementById("btnBack").addEventListener("click", () => {
              history.back();
            });
            document.getElementById("btnForward").addEventListener("click", () => {
              history.forward();
            });
      });
    
    </script>
  </head>
  <body>
    <h3>브라우저 정보</h3>
    <button id="btn">브라우저 정보 보기</button>
    <button id="btnBack">뒤로 가기</button>
    <button id="btnForward">앞으로 가기</button>
  </body>
</html>
